[package]
name = "zerocart-send"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LocalSend v2 compatible file sharing for ZeroCart (reimplementation in Rust of the protocol used by ZeroSend)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
